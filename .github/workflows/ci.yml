name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MIX_ENV: test

# Skip the manifest-compat job on PRs from forks (it makes a network call
# to the public GitHub raw URL and reads the upstream MANIFEST, which is
# fine but adds noise — we only really need it on push to main/develop).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================================================
  # UNIT TESTS - Version Matrix
  # ============================================================================
  unit_tests:
    name: Unit Tests (Elixir ${{ matrix.elixir }}, OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.18.4'
            otp: '27.3'
          - elixir: '1.20.2'
            otp: '28.4'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Erlang/OTP and Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          install-hex: true
          install-rebar: true

      - name: Get version for cache bust
        id: mix-version
        run: echo "version=$(grep '@version' mix.exs | head -1 | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Cache Mix dependencies
        uses: actions/cache@v4
        with:
          key: mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ steps.mix-version.outputs.version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ steps.mix-version.outputs.version }}-
            mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-
          path: |
            deps/
            _build/${{ env.MIX_ENV }}

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Install Mix Dependencies
        run: mix deps.get

      - name: Run Tests
        # `--no-compile` + `mix compile` first so the test files compile
        # serially. Without this, `Kernel.ParallelCompiler` occasionally
        # raises `(MatchError) no match of right hand side value: {:error,
        # :enoent}` when test files reference helpers that live under
        # `test/support` (a known intermittent). The serial path is a
        # few seconds slower but predictable.
        run: |
          mix compile
          mix test --exclude integration

      - name: Run Credo
        run: mix credo --strict

  # ============================================================================
  # SMOKE TESTS
  # ============================================================================
  smoke_tests:
    name: Smoke Test (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [cli, tui, daemon, escript]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Erlang/OTP and Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.2'
          otp-version: '28.4'
          install-hex: true
          install-rebar: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          key: cargo-${{ runner.os }}-${{ hashFiles('priv/rust_template/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Clean cached ERTS
        run: rm -rf ~/.cache/batamanta

      - name: Install Mix Dependencies
        working-directory: smoke_tests/test_${{ matrix.mode }}
        run: mix deps.get

      - name: Build with Batamanta
        working-directory: smoke_tests/test_${{ matrix.mode }}
        run: |
          if [ "${{ matrix.mode }}" = "escript" ]; then
            mix batamanta --format escript --compression 1
          else
            mix batamanta --compression 1
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: batamanta-binary-${{ matrix.mode }}
          path: smoke_tests/test_${{ matrix.mode }}/*.run
          retention-days: 7
          if-no-files-found: ignore

      - name: Run Smoke Test
        run: |
          chmod +x smoke_test_runner.sh
          ./smoke_test_runner.sh smoke_tests/test_${{ matrix.mode }} ${{ matrix.mode }} 30

  # ============================================================================
  # COVERAGE
  # ============================================================================
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [unit_tests]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Erlang/OTP and Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.2'
          otp-version: '28.4'
          install-hex: true
          install-rebar: true

      - name: Get version for cache bust
        id: mix-version
        run: echo "version=$(grep '@version' mix.exs | head -1 | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Cache Mix dependencies
        uses: actions/cache@v4
        with:
          key: mix-${{ runner.os }}-28.4-1.20.2-${{ steps.mix-version.outputs.version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-28.4-1.20.2-${{ steps.mix-version.outputs.version }}-
            mix-${{ runner.os }}-28.4-1.20.2-
          path: |
            deps/
            _build/${{ env.MIX_ENV }}

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Install Mix Dependencies
        run: mix deps.get

      - name: Run Tests with Coverage
        run: mix test --cover --exclude integration

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: cover/
          retention-days: 30

  # ============================================================================
  # MANIFEST COMPAT — verifies that batamanta's Target.manifest_key/1
  # matches every key the upstream mirror actually publishes, and that
  # the floor version (OTP 27.0) is in the mirror. This catches two
  # classes of breakage at PR time:
  #   1. A new target is added to Target but the mirror hasn't shipped it
  #   2. A key naming drift between batamanta and the mirror
  #
  # Only runs on push to main/develop (not on PRs from forks, where the
  # MANIFEST upstream isn't a concern of the PR author).
  # ============================================================================
  manifest_compat:
    name: Manifest compatibility
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: [unit_tests]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Erlang/OTP and Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.2'
          otp-version: '28.4'
          install-hex: true
          install-rebar: true

      - name: Cache Mix dependencies
        uses: actions/cache@v4
        with:
          key: mix-compat-${{ runner.os }}-28.4-1.20.2-${{ hashFiles('mix.lock') }}
          path: |
            deps/
            _build/${{ env.MIX_ENV }}

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Install Mix Dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      # Run the floor + top version cross-check against the upstream mirror.
      # These tests are tagged :integration :compat. They make a single
      # HTTPS GET to the public raw URL of MANIFEST.json.
      - name: Run manifest compatibility tests
        run: mix test test/batamanta/erts/manifest_compat_test.exs --include compat

  # ============================================================================
  # RELEASE (tags only)
  # ============================================================================
  release:
    name: Publish to Hex.pm
    needs: [unit_tests, smoke_tests, manifest_compat]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.2'
          otp-version: '28.4'

      - run: mix deps.get
      - run: mix compile
      - run: mix hex.build
      - run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
