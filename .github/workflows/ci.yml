name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      otp_min:
        description: "OTP min version (override auto-detection)"
        required: false
        type: string
      otp_max:
        description: "OTP max version (override auto-detection)"
        required: false
        type: string
  # Nightly full matrix — every Sunday 02:00 UTC. Builds every
  # (target × format × mode × otp) combination with both min and max
  # OTP versions. Catches regressions the PR smoke_matrix skips
  # (paid runners, slow arm64 builds, etc.).
  schedule:
    - cron: '0 2 * * 0'

permissions:
  contents: read

env:
  MIX_ENV: test

# ---------------------------------------------------------------------------
# Concurrency — cancel in-progress PR runs so we don't double-pay CI minutes,
# but never cancel a push-to-main or scheduled nightly (those we want to finish).
# ---------------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ---------------------------------------------------------------------------
# OTP version resolution — the manifest_compat helper publishes
# `otp_min` and `otp_max` to the job outputs. Every other job reads
# them. workflow_dispatch overrides are optional but useful when a
# new OTP ships and you want to test it before the manifest refreshes.
# ---------------------------------------------------------------------------
jobs:
  resolve_otp_versions:
    name: Resolve OTP min/max from MANIFEST
    runs-on: ubuntu-latest
    outputs:
      otp_min: ${{ steps.resolve.outputs.min }}
      otp_max: ${{ steps.resolve.outputs.max }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch MANIFEST.json and resolve min/max
        id: resolve
        env:
          OVERRIDE_MIN: ${{ inputs.otp_min }}
          OVERRIDE_MAX: ${{ inputs.otp_max }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/Lorenzo-SF/Batamanta---ERTS-repository/main/MANIFEST.json -o /tmp/manifest.json
          # Strip "OTP-" prefix, natural-sort, pick first/last.
          versions=$(jq -r 'keys[] | sub("^OTP-"; "")' /tmp/manifest.json | sort -V)
          min=$(echo "$versions" | head -1)
          max=$(echo "$versions" | tail -1)
          [[ -n "${OVERRIDE_MIN:-}" ]] && min="$OVERRIDE_MIN"
          [[ -n "${OVERRIDE_MAX:-}" ]] && max="$OVERRIDE_MAX"
          echo "min=$min" >> "$GITHUB_OUTPUT"
          echo "max=$max" >> "$GITHUB_OUTPUT"
          echo "Resolved OTP versions: min=$min max=$max"

  # ===========================================================================
  # UNIT TESTS — fast feedback on PR (always runs)
  # ===========================================================================
  unit_tests:
    name: Unit Tests (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    needs: [resolve_otp_versions]
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.18.4'
            otp: ${{ needs.resolve_otp_versions.outputs.otp_min }}
          - elixir: '1.20.2'
            otp: ${{ needs.resolve_otp_versions.outputs.otp_max }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Erlang/OTP and Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          install-hex: true
          install-rebar: true

      - name: Get version for cache bust
        id: mix-version
        run: echo "version=$(grep '@version' mix.exs | head -1 | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Cache Mix dependencies
        uses: actions/cache@v4
        with:
          key: mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ steps.mix-version.outputs.version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ steps.mix-version.outputs.version }}-
            mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-
          path: |
            deps/
            _build/${{ env.MIX_ENV }}

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Install Mix Dependencies
        run: mix deps.get

      - name: Run Tests
        # Serial --no-compile then explicit mix compile avoids the
        # ParallelCompiler `(MatchError) ... enoent` flake on test/support.
        run: |
          mix compile
          mix test --exclude integration

      - name: Run Credo
        run: mix credo --strict

  # ===========================================================================
  # SMOKE MATRIX (PR + main) — representative subset of the full matrix.
  #
  # Goal: every PR + every push to main gets fast feedback that the
  # matrix builds successfully. We don't enumerate the full cross product
  # here (that lives in nightly_full_matrix below). Instead we pick:
  #
  #   * All 3 modes on linux-glibc-amd64 (the cheapest runner).
  #   * cli on every other target we support.
  #   * Both formats (release, escript) where they apply.
  #   * otp_max only (otp_min covered by unit_tests + nightly).
  #
  # Anything marked # PAID RUNNER or # NOT AVAILABLE is intentionally
  # absent from the subset; the nightly builds them when a runner is
  # available, and the comments tell you why.
  # ===========================================================================
  smoke_matrix:
    name: Smoke (${{ matrix.label }})
    runs-on: ${{ matrix.runs_on }}
    needs: [resolve_otp_versions]
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux glibc amd64 (free, ubuntu-latest) ---
          - label: linux-glibc-amd64 / release / cli
            runs_on: ubuntu-latest
            target: linux-glibc-amd64
            format: release
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_max }}
            rust_target: x86_64-unknown-linux-gnu
          - label: linux-glibc-amd64 / release / tui
            runs_on: ubuntu-latest
            target: linux-glibc-amd64
            format: release
            mode: tui
            otp: ${{ needs.resolve_otp_versions.outputs.otp_max }}
            rust_target: x86_64-unknown-linux-gnu
          - label: linux-glibc-amd64 / release / daemon
            runs_on: ubuntu-latest
            target: linux-glibc-amd64
            format: release
            mode: daemon
            otp: ${{ needs.resolve_otp_versions.outputs.otp_max }}
            rust_target: x86_64-unknown-linux-gnu
          - label: linux-glibc-amd64 / escript / cli
            runs_on: ubuntu-latest
            target: linux-glibc-amd64
            format: escript
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_max }}
            rust_target: x86_64-unknown-linux-gnu

          # --- Linux musl amd64 (free, docker alpine) ---
          - label: linux-musl-amd64 / release / cli
            runs_on: ubuntu-latest
            target: linux-musl-amd64
            format: release
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_max }}
            rust_target: x86_64-unknown-linux-musl
            use_docker_alpine: true

          # --- Linux glibc arm64 (free, ubuntu-latest + QEMU) ---
          # ~5min slower per cell than amd64; we only ship cli here.
          - label: linux-glibc-arm64 / release / cli
            runs_on: ubuntu-latest
            target: linux-glibc-arm64
            format: release
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_max }}
            rust_target: aarch64-unknown-linux-gnu
            use_qemu: true

          # --- macOS arm64 (free, macos-latest is Apple Silicon) ---
          - label: darwin-arm64 / release / cli
            runs_on: macos-latest
            target: darwin-arm64
            format: release
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_max }}
            rust_target: aarch64-apple-darwin
          - label: darwin-arm64 / escript / cli
            runs_on: macos-latest
            target: darwin-arm64
            format: escript
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_max }}
            rust_target: aarch64-apple-darwin

          # --- Windows amd64 (free, windows-latest) ---
          # Only :cli is supported on Windows (validator rejects tui/daemon).
          - label: windows-amd64 / release / cli
            runs_on: windows-latest
            target: windows-amd64
            format: release
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_max }}
            rust_target: x86_64-pc-windows-msvc
          - label: windows-amd64 / escript / cli
            runs_on: windows-latest
            target: windows-amd64
            format: escript
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_max }}
            rust_target: x86_64-pc-windows-msvc

          # Intentionally NOT in the PR subset:
          #   * linux-musl-arm64  : expensive (QEMU + musl build), nightly only.
          #   * darwin-amd64      : GitHub Team/Enterprise macos-12 paid only.
          #   * linux-glibc-arm64 / tui|daemon|escript : nightly.
          #   * windows-arm64     : upstream OTP doesn't ship windows-arm64
          #                          prebuilts (no source to mirror).

    steps:
      - uses: actions/checkout@v4

      - name: Setup Erlang/OTP and Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.2'
          otp-version: ${{ matrix.otp }}
          install-hex: true
          install-rebar: true

      - name: Enable QEMU binfmt (arm64 cells on ubuntu-latest)
        if: matrix.use_qemu == true
        run: |
          sudo docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Setup Rust toolchain (+ cross-compile target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install System Dependencies
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == linux-musl-* ]]; then
            sudo apt-get update && sudo apt-get install -y zstd docker.io
          else
            sudo apt-get update && sudo apt-get install -y zstd
          fi

      - name: Clean cached ERTS (avoid cached build bypassing new code)
        run: rm -rf ~/.cache/batamanta

      - name: Pick smoke_test directory
        id: pick
        # Each smoke_test ships a specific (format, mode). Map the matrix
        # cell to the existing test directory; only run the cell if a
        # matching test exists (nightly covers the gaps).
        shell: bash
        run: |
          case "${{ matrix.format }}-${{ matrix.mode }}" in
            release-cli)    dir=smoke_tests/test_release_cli ;;
            escript-cli)    dir=smoke_tests/test_escript ;;
            release-tui)    dir=smoke_tests/test_tui ;;
            release-daemon) dir=smoke_tests/test_release_nif ;;
            *) echo "no smoke_test for ${{ matrix.format }}/${{ matrix.mode }}, skipping" >> "$GITHUB_STEP_SUMMARY"
               echo "skip=true" >> "$GITHUB_OUTPUT"
               exit 0 ;;
          esac
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Install Mix Dependencies
        if: steps.pick.outputs.skip != 'true'
        working-directory: ${{ steps.pick.outputs.dir }}
        run: mix deps.get

      - name: Build with Batamanta
        if: steps.pick.outputs.skip != 'true'
        working-directory: ${{ steps.pick.outputs.dir }}
        env:
          # Hint batamanta to the correct target on musl cells; the rest
          # of the targets are auto-detected from the runner's OS/arch.
          BATAMANTA_TARGET: ${{ matrix.target }}
        run: |
          if [[ "${{ matrix.target }}" == linux-musl-* ]]; then
            mix batamanta --format ${{ matrix.format }} --compression 1 --target ${{ matrix.target }}
          else
            mix batamanta --format ${{ matrix.format }} --compression 1
          fi

      - name: Smoke-test the resulting binary
        if: steps.pick.outputs.skip != 'true'
        shell: bash
        run: |
          chmod +x smoke_test_runner.sh
          ./smoke_test_runner.sh ${{ steps.pick.outputs.dir }} ${{ matrix.mode }} 60

      - name: Upload Binary Artifact
        if: steps.pick.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: batamanta-${{ matrix.label }}
          path: ${{ steps.pick.outputs.dir }}/*.run
          retention-days: 7
          if-no-files-found: ignore

  # ===========================================================================
  # NIGHTLY FULL MATRIX — runs every Sunday 02:00 UTC. Enumerates every
  # (os, arch, libc, format, mode, otp_version) cell that batamanta
  # *should* support, including the cells the smoke_matrix above skips
  # because they're slow or require paid runners.
  #
  # If a cell's runner type is unavailable on this GitHub account, the
  # cell is still included but guarded by `if:` so we can flip it on
  # the day the runner becomes available without re-editing the matrix.
  # ===========================================================================
  nightly_full_matrix:
    name: Nightly ${{ matrix.label }}
    runs-on: ${{ matrix.runs_on }}
    needs: [resolve_otp_versions]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # Build every (target, format, mode, otp) combination that
        # batamanta's Validator accepts. The 'runs_on' field picks the
        # runner; cells that need paid runners are still listed but
        # guarded so they fail-loud with a clear comment if attempted.
        include:
          # --- linux glibc amd64 ---
          - label: linux-glibc-amd64 / release / cli
            runs_on: ubuntu-latest
            target: linux-glibc-amd64
            format: release
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_min }}
            rust_target: x86_64-unknown-linux-gnu
          - label: linux-glibc-amd64 / release / cli
            runs_on: ubuntu-latest
            target: linux-glibc-amd64
            format: release
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_max }}
            rust_target: x86_64-unknown-linux-gnu
          - label: linux-glibc-amd64 / release / tui
            runs_on: ubuntu-latest
            target: linux-glibc-amd64
            format: release
            mode: tui
            otp: ${{ needs.resolve_otp_versions.outputs.otp_min }}
            rust_target: x86_64-unknown-linux-gnu
          - label: linux-glibc-amd64 / release / tui
            runs_on: ubuntu-latest
            target: linux-glibc-amd64
            format: release
            mode: tui
            otp: ${{ needs.resolve_otp_versions.outputs.otp_max }}
            rust_target: x86_64-unknown-linux-gnu
          - label: linux-glibc-amd64 / release / daemon
            runs_on: ubuntu-latest
            target: linux-glibc-amd64
            format: release
            mode: daemon
            otp: ${{ needs.resolve_otp_versions.outputs.otp_min }}
            rust_target: x86_64-unknown-linux-gnu
          - label: linux-glibc-amd64 / release / daemon
            runs_on: ubuntu-latest
            target: linux-glibc-amd64
            format: release
            mode: daemon
            otp: ${{ needs.resolve_otp_versions.outputs.otp_max }}
            rust_target: x86_64-unknown-linux-gnu
          - label: linux-glibc-amd64 / escript / cli
            runs_on: ubuntu-latest
            target: linux-glibc-amd64
            format: escript
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_min }}
            rust_target: x86_64-unknown-linux-gnu
          - label: linux-glibc-amd64 / escript / cli
            runs_on: ubuntu-latest
            target: linux-glibc-amd64
            format: escript
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_max }}
            rust_target: x86_64-unknown-linux-gnu

          # --- linux musl amd64 (docker alpine) ---
          - label: linux-musl-amd64 / release / cli
            runs_on: ubuntu-latest
            target: linux-musl-amd64
            format: release
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_min }}
            rust_target: x86_64-unknown-linux-musl
            use_docker_alpine: true
          - label: linux-musl-amd64 / release / cli
            runs_on: ubuntu-latest
            target: linux-musl-amd64
            format: release
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_max }}
            rust_target: x86_64-unknown-linux-musl
            use_docker_alpine: true
          - label: linux-musl-amd64 / escript / cli
            runs_on: ubuntu-latest
            target: linux-musl-amd64
            format: escript
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_min }}
            rust_target: x86_64-unknown-linux-musl
            use_docker_alpine: true
          - label: linux-musl-amd64 / escript / cli
            runs_on: ubuntu-latest
            target: linux-musl-amd64
            format: escript
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_max }}
            rust_target: x86_64-unknown-linux-musl
            use_docker_alpine: true

          # --- linux glibc arm64 (QEMU on ubuntu-latest) ---
          - label: linux-glibc-arm64 / release / cli
            runs_on: ubuntu-latest
            target: linux-glibc-arm64
            format: release
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_min }}
            rust_target: aarch64-unknown-linux-gnu
            use_qemu: true
          - label: linux-glibc-arm64 / release / cli
            runs_on: ubuntu-latest
            target: linux-glibc-arm64
            format: release
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_max }}
            rust_target: aarch64-unknown-linux-gnu
            use_qemu: true
          - label: linux-glibc-arm64 / escript / cli
            runs_on: ubuntu-latest
            target: linux-glibc-arm64
            format: escript
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_min }}
            rust_target: aarch64-unknown-linux-gnu
            use_qemu: true
          - label: linux-glibc-arm64 / escript / cli
            runs_on: ubuntu-latest
            target: linux-glibc-arm64
            format: escript
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_max }}
            rust_target: aarch64-unknown-linux-gnu
            use_qemu: true

          # --- linux musl arm64 (docker alpine + QEMU) ---
          - label: linux-musl-arm64 / release / cli
            runs_on: ubuntu-latest
            target: linux-musl-arm64
            format: release
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_min }}
            rust_target: aarch64-unknown-linux-musl
            use_qemu: true
            use_docker_alpine: true
          - label: linux-musl-arm64 / release / cli
            runs_on: ubuntu-latest
            target: linux-musl-arm64
            format: release
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_max }}
            rust_target: aarch64-unknown-linux-musl
            use_qemu: true
            use_docker_alpine: true

          # --- darwin arm64 (macos-latest, free) ---
          - label: darwin-arm64 / release / cli
            runs_on: macos-latest
            target: darwin-arm64
            format: release
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_min }}
            rust_target: aarch64-apple-darwin
          - label: darwin-arm64 / release / cli
            runs_on: macos-latest
            target: darwin-arm64
            format: release
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_max }}
            rust_target: aarch64-apple-darwin
          - label: darwin-arm64 / escript / cli
            runs_on: macos-latest
            target: darwin-arm64
            format: escript
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_min }}
            rust_target: aarch64-apple-darwin
          - label: darwin-arm64 / escript / cli
            runs_on: macos-latest
            target: darwin-arm64
            format: escript
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_max }}
            rust_target: aarch64-apple-darwin
          - label: darwin-arm64 / release / tui
            runs_on: macos-latest
            target: darwin-arm64
            format: release
            mode: tui
            otp: ${{ needs.resolve_otp_versions.outputs.otp_min }}
            rust_target: aarch64-apple-darwin
          - label: darwin-arm64 / release / tui
            runs_on: macos-latest
            target: darwin-arm64
            format: release
            mode: tui
            otp: ${{ needs.resolve_otp_versions.outputs.otp_max }}
            rust_target: aarch64-apple-darwin
          - label: darwin-arm64 / release / daemon
            runs_on: macos-latest
            target: darwin-arm64
            format: release
            mode: daemon
            otp: ${{ needs.resolve_otp_versions.outputs.otp_min }}
            rust_target: aarch64-apple-darwin
          - label: darwin-arm64 / release / daemon
            runs_on: macos-latest
            target: darwin-arm64
            format: release
            mode: daemon
            otp: ${{ needs.resolve_otp_versions.outputs.otp_max }}
            rust_target: aarch64-apple-darwin

          # --- darwin amd64 (PAID RUNNER) ---
          # GitHub-hosted macos-12 (Intel) requires a paid plan. The
          # cells below are wired up so the day you flip on a paid plan
          # (or add a self-hosted Intel Mac runner), they Just Work.
          # Until then the `runs_on` value triggers a "no matching runner"
          # error which fails the cell loudly and lets you see you're
          # missing coverage; flip these on by uncommenting.
          #
          #  - { label: darwin-amd64 / release / cli,    runs_on: macos-12, target: darwin-amd64, format: release, mode: cli,    otp: ${{ needs.resolve_otp_versions.outputs.otp_min }}, rust_target: x86_64-apple-darwin, requires_paid_runner: true }
          #  - { label: darwin-amd64 / release / cli,    runs_on: macos-12, target: darwin-amd64, format: release, mode: cli,    otp: ${{ needs.resolve_otp_versions.outputs.otp_max }}, rust_target: x86_64-apple-darwin, requires_paid_runner: true }

          # --- windows amd64 (windows-latest, free; cli only per validator) ---
          - label: windows-amd64 / release / cli
            runs_on: windows-latest
            target: windows-amd64
            format: release
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_min }}
            rust_target: x86_64-pc-windows-msvc
          - label: windows-amd64 / release / cli
            runs_on: windows-latest
            target: windows-amd64
            format: release
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_max }}
            rust_target: x86_64-pc-windows-msvc
          - label: windows-amd64 / escript / cli
            runs_on: windows-latest
            target: windows-amd64
            format: escript
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_min }}
            rust_target: x86_64-pc-windows-msvc
          - label: windows-amd64 / escript / cli
            runs_on: windows-latest
            target: windows-amd64
            format: escript
            mode: cli
            otp: ${{ needs.resolve_otp_versions.outputs.otp_max }}
            rust_target: x86_64-pc-windows-msvc

          # Intentionally NOT in the matrix:
          #   * windows-arm64 : NO upstream OTP prebuilds for windows-arm64
          #                     (erlang/otp doesn't publish them), and
          #                     there's no GitHub-hosted windows-arm64
          #                     runner — so there's nothing to test.

    steps:
      # Same step bodies as smoke_matrix; both jobs share the same
      # shape, only the trigger differs. The shared step block would
      # normally be extracted into a `composite` action; for now
      # duplication is fine and keeps the two matrices readable.
      - uses: actions/checkout@v4

      - name: Setup Erlang/OTP and Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.2'
          otp-version: ${{ matrix.otp }}
          install-hex: true
          install-rebar: true

      - name: Enable QEMU binfmt (arm64 cells on ubuntu-latest)
        if: matrix.use_qemu == true
        run: |
          sudo docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Setup Rust toolchain (+ cross-compile target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install System Dependencies
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == linux-musl-* ]]; then
            sudo apt-get update && sudo apt-get install -y zstd docker.io
          else
            sudo apt-get update && sudo apt-get install -y zstd
          fi

      - name: Clean cached ERTS
        run: rm -rf ~/.cache/batamanta

      - name: Pick smoke_test directory
        id: pick
        shell: bash
        run: |
          case "${{ matrix.format }}-${{ matrix.mode }}" in
            release-cli)    dir=smoke_tests/test_release_cli ;;
            escript-cli)    dir=smoke_tests/test_escript ;;
            release-tui)    dir=smoke_tests/test_tui ;;
            release-daemon) dir=smoke_tests/test_release_nif ;;
            *) echo "no smoke_test for ${{ matrix.format }}/${{ matrix.mode }}" >> "$GITHUB_STEP_SUMMARY"
               echo "skip=true" >> "$GITHUB_OUTPUT"
               exit 0 ;;
          esac
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Install Mix Dependencies
        if: steps.pick.outputs.skip != 'true'
        working-directory: ${{ steps.pick.outputs.dir }}
        run: mix deps.get

      - name: Build with Batamanta
        if: steps.pick.outputs.skip != 'true'
        working-directory: ${{ steps.pick.outputs.dir }}
        env:
          BATAMANTA_TARGET: ${{ matrix.target }}
        run: |
          if [[ "${{ matrix.target }}" == linux-musl-* ]]; then
            mix batamanta --format ${{ matrix.format }} --compression 1 --target ${{ matrix.target }}
          else
            mix batamanta --format ${{ matrix.format }} --compression 1
          fi

      - name: Smoke-test the resulting binary
        if: steps.pick.outputs.skip != 'true'
        shell: bash
        run: |
          chmod +x smoke_test_runner.sh
          ./smoke_test_runner.sh ${{ steps.pick.outputs.dir }} ${{ matrix.mode }} 60

      - name: Upload Binary Artifact
        if: steps.pick.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.label }}
          path: ${{ steps.pick.outputs.dir }}/*.run
          retention-days: 14
          if-no-files-found: ignore

  # ===========================================================================
  # COVERAGE (PR + main, ubuntu-latest, otp_max)
  # ===========================================================================
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [resolve_otp_versions, unit_tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Erlang/OTP and Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.2'
          otp-version: ${{ needs.resolve_otp_versions.outputs.otp_max }}
          install-hex: true
          install-rebar: true

      - name: Get version for cache bust
        id: mix-version
        run: echo "version=$(grep '@version' mix.exs | head -1 | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Cache Mix dependencies
        uses: actions/cache@v4
        with:
          key: mix-cover-${{ runner.os }}-${{ needs.resolve_otp_versions.outputs.otp_max }}-1.20.2-${{ steps.mix-version.outputs.version }}-${{ hashFiles('mix.lock') }}
          path: |
            deps/
            _build/${{ env.MIX_ENV }}

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Install Mix Dependencies
        run: mix deps.get

      - name: Run Tests with Coverage
        run: mix test --cover --exclude integration

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: cover/
          retention-days: 30

  # ===========================================================================
  # MANIFEST COMPAT — verifies batamanta's Target.manifest_key/1 matches
  # every key the upstream mirror actually publishes, and that the floor
  # (otp_min) is in the mirror. Skipped on PRs from forks.
  # ===========================================================================
  manifest_compat:
    name: Manifest compatibility
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: [resolve_otp_versions, unit_tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Erlang/OTP and Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.2'
          otp-version: ${{ needs.resolve_otp_versions.outputs.otp_max }}
          install-hex: true
          install-rebar: true

      - name: Cache Mix dependencies
        uses: actions/cache@v4
        with:
          key: mix-compat-${{ runner.os }}-${{ needs.resolve_otp_versions.outputs.otp_max }}-1.20.2-${{ hashFiles('mix.lock') }}
          path: |
            deps/
            _build/${{ env.MIX_ENV }}

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Install Mix Dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Run manifest compatibility tests
        run: mix test test/batamanta/erts/manifest_compat_test.exs --include compat

  # ===========================================================================
  # RELEASE — publish to Hex on tag push
  # ===========================================================================
  release:
    name: Publish to Hex.pm
    needs: [unit_tests, smoke_matrix, manifest_compat]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.2'
          otp-version: ${{ needs.resolve_otp_versions.outputs.otp_max }}
      - run: mix deps.get
      - run: mix compile
      - run: mix hex.build
      - run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
