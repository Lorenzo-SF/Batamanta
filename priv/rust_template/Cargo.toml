[package]
name = "batamanta_dispenser"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
serde_json = "1.0"
tar = "0.4.40"
zstd = "0.13"

# nix + libc process APIs are Unix-only (fork/execvp/kill have no Windows
# equivalent, and nix doesn't compile its sys/process modules for msvc).
# On Windows the wrapper shells out to bash + the .run script via
# std::process::Command, and daemon mode is unsupported (falls back to
# legacy single-shot). See main.rs cfg gates.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.26", features = ["signal", "process"] }

[build-dependencies]

[profile.release]
opt-level = "z"     # Optimizar para tamaño
lto = true          # Link Time Optimization para reducir aún más el binario
codegen-units = 1   # Mayor optimización a costa de tiempo de compilación
strip = true        # Quitar símbolos de debug
